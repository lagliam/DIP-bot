# Alembic configuration.
#
# Note: there is deliberately no `sqlalchemy.url` here. alembic/env.py reads the URL
# from the application configuration (the DB_* variables in .env, or DATABASE_URL),
# so credentials are never written to a config file and there is one source of truth.
# Override for a one-off run with:  alembic -x url=mysql+asyncmy://... upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
